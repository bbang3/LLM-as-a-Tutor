# SFT distillation baseline: Qwen3-8B teacher → Qwen3-1.7B student.
#
# Same training prompts as the RL run (llm_tutor_base), same eval
# benchmarks downstream. Optimizer settings are SFT-standard (lr 1e-5,
# cosine, 3 epoch); batch size 16 is chosen so that the total number of
# gradient updates (~750) is in the same order of magnitude as the RL run's
# PPO updates, given the 4k-row training set.
#
# Pipeline:
#   1) baselines/sft_distill/generate_teacher_responses.py — offline vLLM
#      generation of Qwen3-8B responses on the wildchecklists prompts
#      (single response per prompt, same sampling as the RL data_generator:
#      temp=0.6, top_p=0.95, top_k=20, max_tokens=4096, enable_thinking=true).
#   2) Output parquet has columns:  prompt: str, response: str.
#   3) This config trains the 1.7B student on those (prompt, response) pairs
#      with prompt-mask SFT (loss only on response tokens).
#
# Entry point: verl.trainer.fsdp_sft_trainer (launched via
# baselines/sft_distill/run_sft_distill.sh).

hydra:
  searchpath:
    - file://verl/verl/trainer/config

defaults:
  - sft_trainer
  - _self_

data:
  train_files: ./datasets/sft_distill/wildchecklists_qwen3_8b_teacher.parquet
  val_files: ./datasets/sft_distill/wildchecklists_qwen3_8b_teacher.parquet
  prompt_key: prompt
  response_key: response
  prompt_dict_keys: null
  response_dict_keys: null
  multiturn:
    enable: false
  train_batch_size: 16
  micro_batch_size_per_gpu: 2          # 4 GPU × 2 = 8 → grad accum = 2 per step
  max_length: 12288                    # prompt 8k + response 4k
  truncation: error
  apply_chat_template_kwargs:
    enable_thinking: true              # parity with RL data.apply_chat_template_kwargs

model:
  partial_pretrain: Qwen/Qwen3-1.7B
  enable_gradient_checkpointing: true
  fsdp_config:
    model_dtype: bfloat16
    wrap_policy:
      min_num_params: 0
    cpu_offload: false
    offload_params: false
  strategy: fsdp2

optim:
  lr: 1.0e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  lr_warmup_steps_ratio: 0.05          # ≈ 37 warmup steps on 750 total
  lr_scheduler: cosine
  clip_grad: 1.0

ulysses_sequence_parallel_size: 1
use_remove_padding: true

trainer:
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  entity_name: prompting-llm
  project_name: prompting-llm-verl
  experiment_name: sft_distill_v1.0_base
  total_epochs: 3
  logger: ["console", "wandb"]
  seed: 1
  save_freq: 124
  test_freq: -1
  nnodes: 1
  n_gpus_per_node: 4
  resume_mode: auto
  checkpoint:
    save_contents: ["model", "optimizer", "extra", "hf_model"]
  device: cuda
