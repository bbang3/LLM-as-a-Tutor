# NOTE: do NOT add `hydra.searchpath` in this base config — child configs
# that inherit from this file must declare it themselves. Declaring it in
# both the base and a child causes hydra to raise on override conflict.

defaults:
  - ppo_trainer
  - _self_

trainer:
  logger: ["console", "wandb"]
  entity_name: prompting-llm
  project_name: prompting-llm-verl
  experiment_name: llm_tutor_base
  n_gpus_per_node: 4
  nnodes: 1
  save_freq: 124
  test_freq: -1 # no validation during training
  # max_actor_ckpt_to_keep: 2 # save all checkpoints
  total_epochs: 3 # 1500 train steps = 625 iter steps * 4 upg
  # total_training_steps: 625
  log_val_generations: 200
  validation_data_dir: ${trainer.default_local_dir}
  rollout_data_dir: ${trainer.validation_data_dir}/rollouts

# ── AdaptiveDataset ──────────────────────────────────────────────────────────
# OnlineDataGenerator regenerates the rubric (and optionally adds a constraint)
# for every active sample at epoch boundaries.
data:
  custom_cls:
    path: verl/llm_tutor/adaptive_dataset.py
    name: AdaptiveDataset
  dataloader_num_workers: 0      # required: __getitem__ overrides must be process-local
  shuffle: false                 # required: _dataset_idx must be stable across epochs

  train_files: BBang3/wildchecklists-with-general
  # No in-training validation; the trainer skips val dataloader construction
  # when this is null. test_freq below is disabled too.
  val_files: null
  train_batch_size: 32
  val_batch_size: 256
  prompt_key: prompt
  return_raw_chat: true
  max_prompt_length: 8192
  max_response_length: 4096
  filter_overlong_prompts: true
  filter_overlong_prompts_workers: 16
  seed: 42
  apply_chat_template_kwargs:
    enable_thinking: true


# ── Online data generation ──────────────────────────────────────────────────
data_generator:
  # Generation mode (see online_data_generator._VALID_MODES). The canonical
  # paper run is ``constraint`` (LLM-as-a-Tutor); every paper config below
  # overrides this explicitly. Configs with AdaptiveDataset disabled
  # (general_only, wildchecklists) ignore this field.
  mode: constraint

  # Generation schedule: "epoch" (iterative — regenerate whole dataset once
  # per epoch) or "step" (online — regenerate the current batch before each
  # training step, mutating the DataProto in-flight). "step" gives the most
  # recent policy snapshot but pays wake/sleep + preview-rollout cost per step.
  schedule: epoch

  # Number of policy rollouts per prompt at each generation step.
  n_rollouts: 2

  # Max retry attempts per stage when generator output fails to parse
  # (or when a rollout produces fewer than 2 valid responses).
  max_retry: 5

  # Heavy-tail compaction for both legs:
  #   * rollout_retry_oversample → _gen_rollouts (model-side rollouts)
  #   * generator_retry_oversample → _generate_with_retry_keyed
  #     (constraint_judgment, decision, rewrite, general_rubric, etc.)
  # Attempt 0 still sends 1 sample/prompt, so first-try success rate is
  # unchanged. Retry rounds batch K duplicates per pending prompt and
  # accept the first parse-success — same total sample budget as K
  # sequential retries, folded into one wake/sleep round. Mirrors
  # rubric_policy_v1.6_base defaults.
  rollout_retry_oversample: 5
  rollout_max_retry: 1
  generator_retry_oversample: 5
  generator_max_retry: 1

  # offline_general_rubric.py knob: when true, regenerate general rubrics
  # even for rows that already have non-empty requirements_general /
  # weights_general columns. When false (default), preserve existing seeds
  # and only fill rows that are missing or empty.
  offline_overwrite_existing: false

  # Prompt templates for the 8B generator.
  general_rubric_prompt: data_generation/prompts/base_rubric_generation.txt
  constraint_judgment_prompt: data_generation/prompts/constraint_generation.txt
  adaptive_rubric_prompt: data_generation/prompts/policy_adaptive_rubric_generation.txt

  # Regex patterns used to parse generator output.
  parse_patterns:
    thinking: '<think>(.*?)</think>'
    analysis: '<analysis>(.*?)</analysis>'
    decision: '<decision>(.*?)</decision>'
    constraint: '<constraint>(.*?)</constraint>'
    rubric: '<rubric>(.*?)</rubric>'
    criterion: '<criterion>(.*?)</criterion>'
    importance: '<importance>(.*?)</importance>'

  # Generator model path (sent in the chat-completions payload). Defaults to
  # the reward model server since both are served by the same vLLM router.
  # Set to null to fall back to server default (single-model deployments).
  model_path: ${reward_model.model.path}
  max_tokens: 8192
  temperature: 0.6
  top_p: 0.95
  top_k: 20
  # Forwarded as chat_template_kwargs.enable_thinking to vLLM.
  enable_thinking: true

  # Cap on concurrent in-flight HTTP requests to the local vLLM router. 1024
  # is well within its async capacity; 0 = unlimited.
  concurrency_limit: 1024

  # Debug: directory where per-stage JSONL files are appended
  # (general_rubric.jsonl, constraint_judgment.jsonl, adaptive_rubric.jsonl).
  # Set to null to disable.
  debug_dir: ${trainer.validation_data_dir}/data_generator


algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

actor_rollout_ref:
  model_dtype: bfloat16
  model:
    path: Qwen/Qwen3-1.7B
    enable_gradient_checkpointing: true
    use_remove_padding: true

  actor:
    fsdp_config:
      model_dtype: bfloat16
      param_offload: true
    checkpoint:
      save_contents: ["model", "optimizer", "extra", "hf_model"]
    optim:
      lr: 5e-6
      lr_warmup_steps: 25
    ppo_mini_batch_size: 8
    ppo_micro_batch_size_per_gpu: 2
    clip_ratio: 0.2
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl

  rollout:
    log_prob_micro_batch_size_per_gpu: 2
    name: vllm
    n: 8
    do_sample: true
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    gpu_memory_utilization: 0.8
    tensor_model_parallel_size: 1
    max_model_len: 40960
    disable_log_stats: false
    val_kwargs:
      n: 1
      do_sample: ${actor_rollout_ref.rollout.do_sample}
      temperature: ${actor_rollout_ref.rollout.temperature}
      top_p: ${actor_rollout_ref.rollout.top_p}
      top_k: ${actor_rollout_ref.rollout.top_k}
      # Override rollout.response_length for validation only. Training stays at
      # data.max_response_length (4k) for memory; benchmarks want 8k because
      # Qwen3's thinking block regularly eats several thousand tokens before
      # the answer starts.
      response_length: 8192
      # Override rollout.prompt_length for validation only. A handful of
      # advancedif samples (complex_if_single_turn_v5) ship 20k+ token
      # instruction chains (full wiki articles inlined); the default 8k pad
      # would crash torch.cat in the postprocess. 32k leaves the per-sample
      # prompt + 8k response within the Qwen3 native 40960 context window.
      prompt_length: 32768
  ref:
    log_prob_micro_batch_size_per_gpu: 2
    fsdp_config:
      param_offload: true

reward_model:
  enable: true
  model:
    path: Qwen/Qwen3-8B
  use_reward_loop: true
  rollout:
    name: vllm
    gpu_memory_utilization: 0.8
    tensor_model_parallel_size: 1
    prompt_length: 10240 # (4k policy prompt + 4k policy response + 1k judge propmt + 1k buffer)
    response_length: 4096
    max_model_len: 32768
    enforce_eager: false
  overlong_buffer:
    enable: false
    len: 1024
    penalty_factor: 1.0
    penalty_weight: "gap"
    log: false
  reward_manager: rubric
  num_workers: 4
  micro_batch_size_per_gpu: 2

custom_reward_function:
  path: verl/llm_tutor/reward_function.py
  name: compute_score
  reward_kwargs:
    source_dispatch:
      __default__:
        path: verl/llm_tutor/reward_wildchecklists.py
        name: compute_score_rubric_list
        keep_keys: ["requirements", "weights", "prompt"]
        reward_kwargs:
          judge_model_name: ${reward_model.model.path}
          template_name: judge.txt
          score_aggregation: weighted_mean
          parse_fail_score: -1.0
          max_tokens: ${reward_model.rollout.response_length}
          enable_thinking: true
          temperature: ${actor_rollout_ref.rollout.temperature}
          top_p: ${actor_rollout_ref.rollout.top_p}
          top_k: ${actor_rollout_ref.rollout.top_k}

