# eval_epoch_difficulty.yaml
#
# Probe whether across-epoch prompts get monotonically harder for the base
# policy. For each sampled original_prompt:
#   - Base policy generates n_rollouts responses for the bare original_prompt
#     (baseline) AND for each epoch-specific input.
#   - Judge scores baseline rollouts against general_requirements only
#     (a true zero-constraint reference), and per-epoch rollouts against the
#     epoch's full requirements (general + constraint + adaptive).
#
# Input is the file produced by `sample_epoch_prompts.py` (one record per
# original_prompt, with a list of epoch entries).

data_parallel_size: auto

input_path: /shared/sangminhwang/pllm_logs/eval_epoch_difficulty_sample100.jsonl

n_rollouts: 8
n_judge_runs: 1

policy_model:
  name: Qwen/Qwen3-1.7B
  gpu_memory_utilization: 0.9
  sampling:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    max_tokens: 4096
  enable_thinking: true

judge_model:
  name: Qwen/Qwen3-8B
  gpu_memory_utilization: 0.9
  sampling:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    max_tokens: 8192
  enable_thinking: true

judge_prompt: templates/template_files/judge.txt

parse:
  thinking: '<think>(.*?)</think>'

output:
  dir: /shared/sangminhwang/pllm_logs
  filename: eval_epoch_difficulty_sample100_with_baseline_results
  format: jsonl
  hub_repo: null
