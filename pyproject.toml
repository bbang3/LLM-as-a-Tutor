[project]
name = "prompting-llm-verl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyext",
    "verl[vllm]",
    "torch==2.8.0",
    "vllm==0.11.0",
    "pre-commit>=4.5.1",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
    "cohere>=5.20.5",
    "google-generativeai>=0.8.6",
    "anthropic>=0.79.0",
    "mistralai>=1.12.1",
    "reka-api>=3.2.0",
    "tenacity>=9.1.4",
    "together>=2.1.1",
    "ipykernel>=7.2.0",
    "absl-py>=2.3.1",
    "langdetect>=1.0.9",
    "nltk>=3.9.3",
    "immutabledict>=4.3.1",
    "emoji>=2.15.0",
    "syllapy>=0.7.2",
    "unicodedata2>=17.0.1",
    "setuptools>=79.0.1",
    "httpx>=0.28.1",
    "tqdm>=4.67.1",
    "pydantic>=2",
    "pydantic-settings>=2.12.0",
    "backoff>=2.2.1",
    "wandb>0.24.0",
    "gpustat>=1.1.1",
    "shortuuid>=1.0.13",
    "boto3>=1.42.96",
    "python-dotenv>=1.2.1",
    "qwen-vl-utils>=0.0.14",
]

[tool.uv.sources]
pyext = { git = "https://github.com/ShaohonChen/PyExt.git", rev = "py311support" }
verl = { path = "./verl", editable = true }

[tool.uv.pip]
no-build-isolation-package = ["flash-attn"]

[tool.black]
line-length = 120
target-version = ['py313']

[tool.ruff.lint]
# Enable isort (I) for import sorting only
select = ["I"]
# Ignore line too long (handled by formatter)
ignore = ["E501", "E402"]
